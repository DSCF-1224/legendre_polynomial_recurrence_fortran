name = "legendre_polynomial_recurrence_fortran"
version = "0.1.0"
license = "MIT"
author = "DSCF-1224"
maintainer = "37315588+DSCF-1224@users.noreply.github.com"
copyright = "Copyright 2026, DSCF-1224"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
[install]
library = true
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[profiles]
strict.gfortran.flags = "-g -Wall -Wextra -Werror -fPIC -fmax-errors=1 -fbounds-check -fcheck=array-temps -fbacktrace -fcoarray=single -fimplicit-none -ffree-form"
