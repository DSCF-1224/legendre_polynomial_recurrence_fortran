# .github/workflows/watch-fpm-arm64.yml
name: Watch fpm arm64 support

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for linux-arm64 fpm release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view --repo fortran-lang/fpm --json assets --jq '.assets[].name')
          echo "$assets"
          if echo "$assets" | grep -q 'linux-arm64'; then
            echo "::error::fpm now publishes a linux-arm64 asset. Revisit the arm64 source-build workaround in ci.yml."
            exit 1
          fi
